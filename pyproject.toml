[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-os"
version = "0.1.0"
description = "Agent-native, Git-backed product decision infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Product OS contributors"}]
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/abalyasnikov/product-os"
Repository = "https://github.com/abalyasnikov/product-os"
Issues = "https://github.com/abalyasnikov/product-os/issues"
Specification = "https://github.com/abalyasnikov/product-os/blob/main/docs/spec/product-os.md"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
product-os = "product_os.cli:main"
product-os-install = "product_os.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
